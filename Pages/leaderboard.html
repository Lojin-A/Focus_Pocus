<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Focus Pocus - Global Leaderboards</title>
    <link href="https://fonts.googleapis.com/css2?family=Balsamiq+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Assets/CSS/leaderboard.css">
    <!-- Include jQuery for AJAX -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <h1 class="page-title">Focus Pocus leaderboard</h1>

    <div class="leaderboard-wrapper">
        
        <!-- Game 1: Whack-a-Mole -->
        <div class="game-card">
            <div class="card-header">
                <h2>Whack-a-Mole</h2>
            </div>
            <!-- The ID allows AJAX to find exactly where to put the list -->
            <ol id="whack-list" class="top-players">
                <li>Loading scores...</li>
            </ol>
        </div>

        <!-- Game 2: Guess the Number -->
        <div class="game-card">
            <div class="card-header">
                <h2>Guess the Number</h2>
            </div>
            <ol id="guess-list" class="top-players">
                <li>Loading scores...</li>
            </ol>
        </div>

        <!-- Game 3: Memory Match -->
        <div class="game-card">
            <div class="card-header">
                <h2>Memory Match</h2>
            </div>
            <ol id="memory-list" class="top-players">
                <li>Loading scores...</li>
            </ol>
        </div>

        <!-- Game 4: Rock Paper Scissors -->
        <div class="game-card">
            <div class="card-header">
                <h2>RPS Battle</h2>
            </div>
            <ol id="rps-list" class="top-players">
                <li>Loading scores...</li>
            </ol>
        </div>

    </div>

    <!-- The Messenger that connects to fetch_leaderboard.php -->
    <script src="../Assets/JavaScript/leaderboard.js"></script>
</body>
</html>
